apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: postgres-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:17-alpine
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        value: chrisos
                      - name: POSTGRES_DB
                        value: users_db
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: postgres-credentials
                                key: password
                  volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql/data
                  readinessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - pg_isready -U chrisos -d users_db
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  resources:
                      requests:
                          memory: 128Mi
                          cpu: 100m
                      limits:
                          memory: 512Mi
            volumes:
                - name: postgres-data
                  persistentVolumeClaim:
                      claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
spec:
    type: ClusterIP
    selector:
        app: postgres
    ports:
        - port: 5432
          targetPort: 5432
