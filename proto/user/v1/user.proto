syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ChristianPenev/chrisos/gen/go/user/v1;userv1";

service UserService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc BatchGetRoles(BatchGetRolesRequest) returns (BatchGetRolesResponse);
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  google.protobuf.Timestamp created_at = 5;
  string organization_id = 6;
  string role_id = 7;
}

message CreateOrganizationRequest {
  string organization_name = 1;
  string owner_email = 2;
  string owner_first_name = 3;
  string owner_last_name = 4;
}

message CreateOrganizationResponse {
  string organization_id = 1;
  string owner_user_id = 2;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message Role {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  bool owner = 4;
  repeated string permissions = 5;
  google.protobuf.Timestamp created_at = 6;
}

message BatchGetRolesRequest {
  repeated string ids = 1;
}

message BatchGetRolesResponse {
  repeated Role roles = 1;
}
